# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the workflow will run
on:
  # Build the maintained translation branch as well as the default branch.
  push:
    branches: [ "master", "fix/translation-audit-findings" ]
  pull_request:
    branches: [ "master" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  build:
    runs-on: ubuntu-latest
    container: texlive/texlive:latest
    steps:
      - uses: actions/checkout@v4

      # Runs a single command using the runners shell
      - name: Build lettrines
        run: mpost lettrines.mp
        working-directory: lettrines
        
      - name: Get validated byrne-latex
        run: |
          git init byrne-latex
          git -C byrne-latex remote add origin https://github.com/jemmybutton/byrne-latex.git
          git -C byrne-latex fetch --depth 1 origin 08c138e09a4ec6326f9c5e3c3b1bfd2201fb695d
          git -C byrne-latex checkout --detach FETCH_HEAD
          cp byrne-latex/byrne.sty byrne-latex/byrne.mp .

      - name: Build English pdf
        run: lualatex -interaction=nonstopmode -halt-on-error byrne-en-latex.tex && lualatex -interaction=nonstopmode -halt-on-error byrne-en-latex.tex

      - name: Build Brazilian Portuguese pdf
        run: lualatex -interaction=nonstopmode -halt-on-error byrne-pt-br-latex.tex && lualatex -interaction=nonstopmode -halt-on-error byrne-pt-br-latex.tex

      - name: Build Russian pdf
        run: lualatex -interaction=nonstopmode -halt-on-error byrne-ru-latex.tex && lualatex -interaction=nonstopmode -halt-on-error byrne-ru-latex.tex

      - uses: actions/upload-artifact@v4
        with:
          name: pdfs
          path: byrne*latex.pdf
